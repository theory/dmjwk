name: ✅ Test and Lint
on:
  push:
    branches-ignore: [wip/**]
jobs:
  first-class:
    strategy:
      matrix:
        os:
          - { emoji: 🐧, name: linux/amd64, on: ubuntu-latest }
          - { emoji: 🐧, name: linux/arm64, on: ubuntu-24.04-arm }
          - { emoji: 🍎, name: macos/arm64, on: macos-latest }
          - { emoji: 🍎, name: macos/amd64, on: macos-15-intel }
          - { emoji: 🪟, name: windows/amd64, on: windows-latest }
    name: ${{ matrix.os.emoji }} ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.on }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with: { submodules: true }
      - name: Setup Go
        uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true }
      - name: Run Tests
        run: make test

  bsds:
    name: ${{ matrix.os.emoji }} ${{ matrix.os.name }}/${{ matrix.os.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: freebsd, arch: amd64, version: "15.1", emoji: 😈 }
          - { name: freebsd, arch: arm64, version: "15.1", emoji: 😈 }
          - { name: openbsd, arch: amd64, version: "7.9", emoji: 🐡 }
          - { name: openbsd, arch: arm64, version: "7.9", emoji: 🐡 }
          - { name: netbsd, arch: amd64, version: "10.1", emoji: 🚩 }
          - { name: netbsd, arch: arm64, version: "10.1", emoji: 🚩 }
          - { name: dragonfly, arch: amd64, version: "6.4.2", emoji: 🦋 }
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Download Go
        run: |
          curl -Lo go.tgz https://go.dev/dl/go$(grep ^go go.mod | awk '{print $2}').${{ matrix.os.name }}-${{ matrix.os.arch }}.tar.gz
          tar zxf go.tgz
          rm go.tgz
      - name: Start ${{ matrix.os.name }}/${{ matrix.os.arch }}
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: ${{ matrix.os.name }}${{ matrix.os.name == 'dragonfly' && 'bsd' || '' }}
          architecture: ${{ matrix.os.arch == 'amd64' && 'x86-64' || matrix.os.arch }}
          version: ${{ matrix.os.version }}
      - name: Run Tests
        env: { GOTOOLCHAIN: local }
        shell: cpa.sh {0}
        run: mv go /tmp && /tmp/go/bin/go test ./...

  lint:
    name: 🔎 Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true }
      - name: Install Dependencies
        run: make debian-lint-depends
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
